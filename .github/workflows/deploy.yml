name: Build and Publish Container Image

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ADR-0001: authentication is Keycloak/OIDC. The deployment target must
      # provide QUARKUS_OIDC_AUTH_SERVER_URL (and the realm must allow the
      # deployed origins as redirect URIs). VITE_OIDC_AUTHORITY/CLIENT_ID are
      # baked into the frontend bundle below.
      - name: Create .env file
        run: |
          if [ "${{ vars.VITE_APP_MODE }}" = "web" ] && { [ -z "${{ vars.VITE_OIDC_AUTHORITY }}" ] || [ -z "${{ vars.VITE_OIDC_CLIENT_ID }}" ]; }; then
            echo "::error::VITE_OIDC_AUTHORITY and VITE_OIDC_CLIENT_ID repo variables must be set for web-mode deploys (ADR-0001)"
            exit 1
          fi
          touch frontend/.env
          echo "VITE_APP_MODE=${{ vars.VITE_APP_MODE }}" >> frontend/.env
          echo "VITE_OIDC_AUTHORITY=${{ vars.VITE_OIDC_AUTHORITY }}" >> frontend/.env
          echo "VITE_OIDC_CLIENT_ID=${{ vars.VITE_OIDC_CLIENT_ID }}" >> frontend/.env

      - name: Build with Maven
        run: mvn clean package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        run: |
          ENV_TAG=${{ github.ref_name == 'main' && 'prod' || 'dev' }}
          # GHCR image paths must be lowercase; the repo name may contain uppercase.
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build . -t "$IMAGE:$ENV_TAG" -t "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:$ENV_TAG"
          docker push "$IMAGE:${{ github.sha }}"
