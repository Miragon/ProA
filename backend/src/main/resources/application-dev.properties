quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:processmap;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.test.continuous-testing=disabled

# Local Keycloak from docker-compose (make auth-up), realm 'proa' with dev users.
# Web mode dev therefore requires the Keycloak container to be running.
quarkus.oidc.auth-server-url=http://localhost:8181/realms/proa

app.mode=web
