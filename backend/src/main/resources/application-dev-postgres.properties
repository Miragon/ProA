quarkus.datasource.db-kind=postgresql
# Matches the docker-compose service: `make db-up`
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/proa
quarkus.datasource.username=proa
quarkus.datasource.password=proa

quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
# Keep local data between dev restarts; use `make db-reset` for a clean slate
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

quarkus.hibernate-orm.database.generation.create-schemas=true
quarkus.hibernate-orm.database.default-schema=local

quarkus.test.continuous-testing=disabled

# Local Keycloak from docker-compose (make auth-up), realm 'proa' with dev users.
# Web mode dev therefore requires the Keycloak container to be running.
quarkus.oidc.auth-server-url=http://localhost:8181/realms/proa

app.mode=web
