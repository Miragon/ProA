quarkus.package.jar.type=uber-jar
quarkus.package.jar.add-runner-suffix=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/proa}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:proa}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:proa}
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.database.generation.create-schemas=true
quarkus.hibernate-orm.database.default-schema=${STAGE:local}
quarkus.rest-client.camunda-cloud-service.url=https://login.cloud.camunda.io
quarkus.rest-client.camunda-modeler-service.url=https://modeler.cloud.camunda.io

# --- Authentication (ADR-0001): Keycloak via OIDC, bearer-only ---
# Production provides the auth server via QUARKUS_OIDC_AUTH_SERVER_URL (or KEYCLOAK_URL).
# The default keeps the prod profile bootable for local packaging and points at the local
# Keycloak from docker-compose (make auth-up).
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8181/realms/proa}
quarkus.oidc.application-type=service
# Map Keycloak realm roles to the SecurityIdentity roles checked by @RolesAllowed /
# @RolesAllowedIfWebVersion.
quarkus.oidc.roles.role-claim-path=realm_access/roles
# The audience is deliberately NOT enforced: Keycloak access tokens issued to the public
# frontend client carry aud=account (not the client id). The issuer is verified against the
# OIDC discovery metadata of the configured auth-server-url instead.

app.mode=web
