quarkus.datasource.db-kind=h2
# LOCK_TIMEOUT: concurrency tests let a transaction wait for a pessimistic row lock
quarkus.datasource.jdbc.url=jdbc:h2:mem:processmap;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000

quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
# Use the H2 default schema so that the unqualified native cleanup queries in the
# @QuarkusTest DAO tests resolve (the production default-schema ${STAGE:local} would
# place all tables in a schema the H2 session does not search).
quarkus.hibernate-orm.database.default-schema=PUBLIC

# Tests run in desktop mode (no authentication) and must stay hermetic / container-free:
# disable OIDC enforcement. The web-mode authorization tests re-enable the tenant with a
# checked-in test public key via their own @TestProfile (WebModeAuthorizationTest).
quarkus.oidc.tenant-enabled=false
# The web-mode tests clear quarkus.oidc.auth-server-url to verify against a local public key.
# Without this, Quarkus would treat the missing server URL as a cue to start a Keycloak
# Dev Services container whenever Docker is available (slow, and fails the whole suite on
# a startup timeout).
quarkus.keycloak.devservices.enabled=false

app.mode=desktop
