quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:processmap;DB_CLOSE_DELAY=-1

quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
# Use the H2 default schema so that the unqualified native cleanup queries in the
# @QuarkusTest DAO tests resolve (the production default-schema ${STAGE:local} would
# place all tables in a schema the H2 session does not search).
quarkus.hibernate-orm.database.default-schema=PUBLIC

# Tests run in desktop mode (no authentication) and must stay hermetic / container-free:
# disable OIDC enforcement. The web-mode authorization tests re-enable the tenant with a
# checked-in test public key via their own @TestProfile (WebModeAuthorizationTest).
quarkus.oidc.tenant-enabled=false

app.mode=desktop
