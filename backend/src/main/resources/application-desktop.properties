## Desktop mode: file-backed H2 so data survives restarts.
## NOTE: db-kind/dialect are fixed at BUILD time in Quarkus - this profile only
## takes full effect when the jar is BUILT with it:
##   ./mvnw clean package -Dquarkus.profile=desktop
## (release.yml publishes such a jar as pro-a-*-desktop.jar)
## Run with: java -Dquarkus.profile=desktop -jar pro-a-*-desktop.jar
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:~/.proa/proa-db;DB_CLOSE_DELAY=-1

quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# Desktop mode is single-user and intentionally unauthenticated (ADR-0001):
# disable OIDC enforcement entirely so no Keycloak is required.
quarkus.oidc.tenant-enabled=false

app.mode=desktop
