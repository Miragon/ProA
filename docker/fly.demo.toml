# ProA 2.0 public read-only demo on Fly.io (issue #3; docs/proa-2/DEVELOPMENT.md,
# "Demo deployment (Fly.io)"). Deployed by .github/workflows/demo-deploy.yml:
#   flyctl deploy --config docker/fly.demo.toml --app <app> --remote-only --ha=false \
#     --build-arg PROA_DEMO_SEED=<run_id>.<run_attempt>
# from the repository root (the build context; the paths below are relative to
# this file). The app name here is the default; the workflow passes the
# repository variable FLY_DEMO_APP when it is set.
#
# Reset: a deploy with a new PROA_DEMO_SEED builds a fresh seed (the workflow
# passes its run; by hand pass --build-arg PROA_DEMO_SEED=manual-$(date +%s),
# since an unchanged value reuses the remote builder's cached seed); a stop and
# start of the machine returns to the deploy's seed (the database is a copy
# made at every start).
# No volume, no secrets, no Fly Postgres: PostgreSQL runs inside the machine.

app = "proa-demo"
primary_region = "fra"
# The supervisor stops the server, then PostgreSQL.
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  # Never the 1.x Dockerfile at the repository root.
  dockerfile = "Dockerfile.demo"
  # flyctl's own context upload ignores Dockerfile.demo.dockerignore unless named here.
  ignorefile = "Dockerfile.demo.dockerignore"

[deploy]
  # The running release serves until the new machine passes its health check; a
  # release that fails it never takes traffic.
  strategy = "bluegreen"
  wait_timeout = "10m"

[http_service]
  internal_port = 8080
  force_https = true
  # Suspended machines resume in well under a second and cost storage only;
  # the data is read-only, so a resumed machine still shows the seed. If a
  # snapshot is gone, a cold start copies the seed again within seconds.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

# PostgreSQL and Node in one machine. No swap: suspend requires none.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# A crashed supervisor exits 1 and the machine restarts from the seed;
# "always" would keep the machine from staying stopped or suspended.
[[restart]]
  policy = "on-failure"
  retries = 10
