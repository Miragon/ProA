# ProA 2.0 public read-only demo (issue #3), run locally as on Fly.io:
# docker/Dockerfile.demo with its own PostgreSQL and the seed baked in.
# Compose project "proa2-demo"; the image tag is proa-demo:local (never the
# product's proa:local).
#
#   docker compose -p proa2-demo -f docker/compose.demo.yaml up -d --build --wait
#   pnpm --filter @proa/demo check --url http://127.0.0.1:7480
#   PROA_E2E_URL=http://127.0.0.1:7480 pnpm --filter @proa/web e2e demo
#   docker compose -p proa2-demo -f docker/compose.demo.yaml restart demo   # back to the seed
#   PROA_DEMO_SEED=$(date +%s) docker compose -p proa2-demo -f docker/compose.demo.yaml up -d --build --wait   # a fresh seed
#   docker compose -p proa2-demo -f docker/compose.demo.yaml down -v && docker image rm proa-demo:local
#
# PROA_DEMO_PORT moves the host port (default 7480); PROA_DEMO_IMAGE the tag.
# One CPU and 1 GB as the Fly.io VM (docker/fly.demo.toml). The postgres base
# image declares a volume nothing uses; `down -v` removes it.
name: proa2-demo

services:
  demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile.demo
      args:
        # The seed's id; unchanged, a rebuild reuses the cached seed layer.
        # `PROA_DEMO_SEED=$(date +%s) docker compose … up -d --build` seeds afresh.
        PROA_DEMO_SEED: ${PROA_DEMO_SEED:-local}
    image: ${PROA_DEMO_IMAGE:-proa-demo:local}
    init: true
    cpus: 1
    mem_limit: 1g
    environment:
      # The browser's origins of the published port (http on loopback only).
      PROA_PUBLIC_ORIGIN: 'http://127.0.0.1:${PROA_DEMO_PORT:-7480},http://localhost:${PROA_DEMO_PORT:-7480}'
    ports:
      - '127.0.0.1:${PROA_DEMO_PORT:-7480}:8080'
    restart: 'no'
