services:
  db:
    image: postgres:17-alpine
    container_name: proa-db
    environment:
      POSTGRES_USER: proa
      POSTGRES_PASSWORD: proa
      POSTGRES_DB: proa
    ports:
      # 5433 on the host to avoid clashing with other local Postgres instances
      - "5433:5432"
    volumes:
      - proa-db-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proa -d proa"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: proa-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      # 8181 on the host; 8080 is taken by the Quarkus backend
      - "8181:8080"
    volumes:
      - ./scripts/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
        ]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  proa-db-data:
