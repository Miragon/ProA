services:
  db:
    image: postgres:17-alpine
    container_name: proa-db
    environment:
      POSTGRES_USER: proa
      POSTGRES_PASSWORD: proa
      POSTGRES_DB: proa
    ports:
      # 5433 on the host to avoid clashing with other local Postgres instances
      - "5433:5432"
    volumes:
      - proa-db-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proa -d proa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  proa-db-data:
