# ProA 2.0 workspace (CONCEPT §8). The 1.x tree (backend/, frontend/, Maven)
# is not part of it. pnpm 11 reads its settings from this file; .npmrc only
# carries auth and registry settings.
packages:
  - apps/*
  - packages/*
  - eval/tools

# pnpm 11 runs no dependency install scripts unless allowed here. esbuild
# (drizzle-kit, tsx) checks its platform binary; the others are optional
# native add-ons of testcontainers' ssh transport and are not needed.
allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false

# One vite for the whole workspace (vitest would otherwise pull its own).
# pnpm 11 holds back releases younger than a day; bump deliberately.
overrides:
  vite: 8.3.2

# Exact versions only: `pnpm add` writes "1.2.3", never "^1.2.3".
saveExact: true
